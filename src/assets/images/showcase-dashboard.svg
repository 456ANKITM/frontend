    <text x="290" y="162" font-size="13" fill="#6b7280">Overview of all your stores</text>
    <rect x="960" y="120" width="170" height="36" rx="18" fill="#fff" stroke="#e5e7eb"/>
    <text x="986" y="143" font-size="13" font-weight="500" fill="#111827">All stores</text>
    <path d="M1096 136 l5 5 l5 -5" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

