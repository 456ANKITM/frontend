<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" fill="none" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ERP dashboard preview</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="40" y="40" width="1120" height="760" rx="24"/></clipPath>
  </defs>

  <!-- Window -->
  <rect x="40" y="40" width="1120" height="760" rx="24" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>

  <g clip-path="url(#win)">
    <!-- Title bar -->
    <rect x="40" y="40" width="1120" height="48" fill="#fff"/>
    <line x1="40" y1="88" x2="1160" y2="88" stroke="#eef0f2"/>
    <circle cx="68" cy="64" r="6" fill="#e5e7eb"/>
    <circle cx="90" cy="64" r="6" fill="#e5e7eb"/>
    <circle cx="112" cy="64" r="6" fill="#e5e7eb"/>
    <rect x="420" y="51" width="360" height="26" rx="13" fill="#f3f4f6"/>
    <text x="442" y="68" font-size="12" fill="#9ca3af">Search products, invoices, customers...</text>

    <!-- Sidebar -->
    <rect x="40" y="88" width="220" height="712" fill="#fafafa"/>
    <line x1="260" y1="88" x2="260" y2="800" stroke="#eef0f2"/>
    <rect x="64" y="108" width="32" height="32" rx="9" fill="#000"/>
    <rect x="73" y="117" width="14" height="14" rx="3" stroke="#fff" stroke-width="2"/>
    <text x="106" y="130" font-size="16" font-weight="700" fill="#000">ERP Suite</text>

    <rect x="56" y="168" width="188" height="36" rx="10" fill="#000"/>
    <rect x="72" y="179" width="14" height="14" rx="4" stroke="#fff" stroke-width="1.8"/>
    <text x="98" y="191" font-size="14" font-weight="600" fill="#fff">Dashboard</text>

    <rect x="72" y="223" width="14" height="14" rx="4" stroke="#6b7280" stroke-width="1.8"/>
    <text x="98" y="235" font-size="14" font-weight="500" fill="#4b5563">Inventory</text>
    <rect x="72" y="267" width="14" height="14" rx="4" stroke="#6b7280" stroke-width="1.8"/>
    <text x="98" y="279" font-size="14" font-weight="500" fill="#4b5563">Sales / POS</text>
    <rect x="72" y="311" width="14" height="14" rx="4" stroke="#6b7280" stroke-width="1.8"/>
    <text x="98" y="323" font-size="14" font-weight="500" fill="#4b5563">Purchases</text>
    <rect x="72" y="355" width="14" height="14" rx="4" stroke="#6b7280" stroke-width="1.8"/>
    <text x="98" y="367" font-size="14" font-weight="500" fill="#4b5563">Suppliers</text>
    <rect x="72" y="399" width="14" height="14" rx="4" stroke="#6b7280" stroke-width="1.8"/>
    <text x="98" y="411" font-size="14" font-weight="500" fill="#4b5563">Reports</text>
    <rect x="72" y="443" width="14" height="14" rx="4" stroke="#6b7280" stroke-width="1.8"/>
    <text x="98" y="455" font-size="14" font-weight="500" fill="#4b5563">Staff</text>

    <rect x="56" y="720" width="188" height="56" rx="12" fill="#fff" stroke="#e5e7eb"/>
    <circle cx="84" cy="748" r="14" fill="#000"/>
    <text x="84" y="753" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">M</text>
    <text x="108" y="745" font-size="13" font-weight="600" fill="#111827">Main Street</text>
    <text x="108" y="762" font-size="11" fill="#9ca3af">Owner</text>

    <!-- Header -->
