    <text x="310" y="352" font-size="15" font-weight="700" fill="#111827">Sales overview</text>
    <text x="800" y="352" font-size="12" fill="#9ca3af" text-anchor="end">Last 7 days</text>
    <line x1="310" y1="400" x2="800" y2="400" stroke="#f0f1f3"/>
    <line x1="310" y1="440" x2="800" y2="440" stroke="#f0f1f3"/>
    <line x1="310" y1="480" x2="800" y2="480" stroke="#f0f1f3"/>
    <line x1="310" y1="520" x2="800" y2="520" stroke="#f0f1f3"/>
    <path d="M320 510 L398 490 L476 495 L554 455 L632 465 L710 440 L788 420 L788 540 L320 540 Z" fill="url(#area)"/>
    <path d="M320 510 L398 490 L476 495 L554 455 L632 465 L710 440 L788 420" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="788" y1="420" x2="788" y2="540" stroke="#d1d5db" stroke-dasharray="4 4"/>
    <circle cx="788" cy="420" r="6" fill="#fff" stroke="#000" stroke-width="3"/>
    <rect x="748" y="372" width="80" height="28" rx="8" fill="#000"/>
    <text x="788" y="391" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">$1,240</text>
    <g font-size="11" fill="#9ca3af" text-anchor="middle">
      <text x="320" y="560">Mon</text>
      <text x="398" y="560">Tue</text>
      <text x="476" y="560">Wed</text>
      <text x="554" y="560">Thu</text>
      <text x="632" y="560">Fri</text>
      <text x="710" y="560">Sat</text>
      <text x="788" y="560">Sun</text>
    </g>

    <!-- Top products -->
    <rect x="840" y="320" width="290" height="250" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="858" y="352" font-size="15" font-weight="700" fill="#111827">Top products</text>

    <text x="858" y="392" font-size="12" fill="#374151">Basmati Rice 5kg</text>
    <text x="1112" y="392" font-size="12" font-weight="700" fill="#111827" text-anchor="end">248</text>
    <rect x="858" y="400" width="254" height="8" rx="4" fill="#f3f4f6"/>
    <rect x="858" y="400" width="240" height="8" rx="4" fill="#000"/>

    <text x="858" y="436" font-size="12" fill="#374151">Olive Oil 1L</text>
    <text x="1112" y="436" font-size="12" font-weight="700" fill="#111827" text-anchor="end">196</text>
    <rect x="858" y="444" width="254" height="8" rx="4" fill="#f3f4f6"/>
    <rect x="858" y="444" width="190" height="8" rx="4" fill="#374151"/>

    <text x="858" y="480" font-size="12" fill="#374151">Sugar 2kg</text>
    <text x="1112" y="480" font-size="12" font-weight="700" fill="#111827" text-anchor="end">151</text>
    <rect x="858" y="488" width="254" height="8" rx="4" fill="#f3f4f6"/>
    <rect x="858" y="488" width="146" height="8" rx="4" fill="#6b7280"/>

    <text x="858" y="524" font-size="12" fill="#374151">Green Tea Box</text>
    <text x="1112" y="524" font-size="12" font-weight="700" fill="#111827" text-anchor="end">102</text>
    <rect x="858" y="532" width="254" height="8" rx="4" fill="#f3f4f6"/>
    <rect x="858" y="532" width="98" height="8" rx="4" fill="#9ca3af"/>

    <!-- Transactions -->
    <rect x="290" y="590" width="840" height="190" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="310" y="622" font-size="15" font-weight="700" fill="#111827">Recent transactions</text>
    <g font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="0.6">
      <text x="310" y="650">INVOICE</text>
      <text x="460" y="650">CUSTOMER</text>
      <text x="660" y="650">STORE</text>
      <text x="880" y="650">AMOUNT</text>
      <text x="1000" y="650">STATUS</text>
    </g>
    <line x1="310" y1="660" x2="1110" y2="660" stroke="#f0f1f3"/>

    <g font-size="13" fill="#374151">
      <text x="310" y="686" font-weight="600" fill="#111827">#INV-1042</text>
      <text x="460" y="686">Aarav Traders</text>
      <text x="660" y="686">Main Street</text>
      <text x="880" y="686" font-weight="600" fill="#111827">$320.00</text>
      <rect x="1000" y="671" width="64" height="22" rx="11" fill="#f3f4f6"/>
      <text x="1032" y="686" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Paid</text>

      <line x1="310" y1="700" x2="1110" y2="700" stroke="#f0f1f3"/>

      <text x="310" y="722" font-weight="600" fill="#111827">#INV-1041</text>
      <text x="460" y="722">Walk-in customer</text>
      <text x="660" y="722">Airport Road</text>
      <text x="880" y="722" font-weight="600" fill="#111827">$84.50</text>
      <rect x="1000" y="707" width="64" height="22" rx="11" fill="#f3f4f6"/>
      <text x="1032" y="722" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Paid</text>

      <line x1="310" y1="736" x2="1110" y2="736" stroke="#f0f1f3"/>

      <text x="310" y="758" font-weight="600" fill="#111827">#INV-1040</text>
      <text x="460" y="758">Sunrise Mart</text>
      <text x="660" y="758">Main Street</text>
      <text x="880" y="758" font-weight="600" fill="#111827">$1,120.00</text>
      <rect x="1000" y="743" width="64" height="22" rx="11" fill="#000"/>
      <text x="1032" y="758" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Due</text>
    </g>
