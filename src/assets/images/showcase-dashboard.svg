  <!-- Floating: low stock alert -->
  <g filter="url(#soft)">
    <rect x="4" y="520" width="246" height="64" rx="16" fill="#fff" stroke="#e5e7eb"/>
  </g>
  <circle cx="36" cy="552" r="16" fill="#000"/>
  <text x="36" y="558" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">!</text>
  <text x="62" y="546" font-size="13" font-weight="700" fill="#111827">Low stock alert</text>
  <text x="62" y="566" font-size="12" fill="#6b7280">Olive Oil 1L: 4 left</text>

  <!-- Floating: invoice paid -->
  <g filter="url(#soft)">
    <rect x="890" y="772" width="300" height="60" rx="16" fill="#fff" stroke="#e5e7eb"/>
  </g>
  <circle cx="922" cy="802" r="16" fill="#000"/>
  <path d="M915 802 l5 5 l10 -10" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="950" y="798" font-size="13" font-weight="700" fill="#111827">Invoice #INV-1043 paid</text>
  <text x="950" y="816" font-size="12" fill="#6b7280">$540.00 at Main Street</text>
</svg>
