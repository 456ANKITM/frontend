    <rect x="290" y="190" width="195" height="110" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="308" y="220" font-size="12" fill="#6b7280">Today's Sales</text>
    <text x="308" y="258" font-size="26" font-weight="700" fill="#000">$4,820</text>
    <rect x="308" y="270" width="58" height="20" rx="10" fill="#f3f4f6"/>
    <text x="337" y="284" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">+12.4%</text>

    <rect x="505" y="190" width="195" height="110" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="523" y="220" font-size="12" fill="#6b7280">Orders</text>
    <text x="523" y="258" font-size="26" font-weight="700" fill="#000">126</text>
    <rect x="523" y="270" width="52" height="20" rx="10" fill="#f3f4f6"/>
    <text x="549" y="284" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">+8.1%</text>

    <rect x="720" y="190" width="195" height="110" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="738" y="220" font-size="12" fill="#6b7280">Low Stock</text>
    <text x="738" y="258" font-size="26" font-weight="700" fill="#000">7 items</text>
    <rect x="738" y="270" width="92" height="20" rx="10" fill="#000"/>
    <text x="784" y="284" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Needs reorder</text>

    <rect x="935" y="190" width="195" height="110" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="953" y="220" font-size="12" fill="#6b7280">Active Stores</text>
    <text x="953" y="258" font-size="26" font-weight="700" fill="#000">4</text>
    <rect x="953" y="270" width="72" height="20" rx="10" fill="#f3f4f6"/>
    <text x="989" y="284" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">All online</text>

    <!-- Sales chart -->
