<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" fill="none" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>POS billing screen preview</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <clipPath id="win"><rect x="40" y="40" width="1120" height="760" rx="24"/></clipPath>
  </defs>
  <rect x="40" y="40" width="1120" height="760" rx="24" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="40" y="40" width="1120" height="48" fill="#fff"/>
    <line x1="40" y1="88" x2="1160" y2="88" stroke="#eef0f2"/>
    <circle cx="68" cy="64" r="6" fill="#e5e7eb"/><circle cx="90" cy="64" r="6" fill="#e5e7eb"/><circle cx="112" cy="64" r="6" fill="#e5e7eb"/>
    <text x="600" y="68" font-size="13" font-weight="700" fill="#000" text-anchor="middle">New Sale — Main Street</text>

    <!-- Product search / grid -->
    <rect x="64" y="112" width="640" height="48" rx="12" fill="#f3f4f6"/>
    <text x="86" y="141" font-size="13" fill="#9ca3af">Scan barcode or search product...</text>

    <g>
      <rect x="64" y="176" width="150" height="120" rx="14" fill="#fff" stroke="#e5e7eb"/>
      <rect x="80" y="192" width="118" height="56" rx="8" fill="#f3f4f6"/>
      <text x="80" y="268" font-size="12" font-weight="600" fill="#111827">Basmati Rice 5kg</text>
      <text x="80" y="284" font-size="12" font-weight="700" fill="#000">$8.50</text>

      <rect x="230" y="176" width="150" height="120" rx="14" fill="#fff" stroke="#e5e7eb"/>
      <rect x="246" y="192" width="118" height="56" rx="8" fill="#f3f4f6"/>
      <text x="246" y="268" font-size="12" font-weight="600" fill="#111827">Olive Oil 1L</text>
      <text x="246" y="284" font-size="12" font-weight="700" fill="#000">$6.20</text>

      <rect x="396" y="176" width="150" height="120" rx="14" fill="#000"/>
      <rect x="412" y="192" width="118" height="56" rx="8" fill="#2a2a2a"/>
      <text x="412" y="268" font-size="12" font-weight="600" fill="#fff">Sugar 2kg</text>
      <text x="412" y="284" font-size="12" font-weight="700" fill="#fff">$3.10</text>

      <rect x="562" y="176" width="142" height="120" rx="14" fill="#fff" stroke="#e5e7eb"/>
      <rect x="578" y="192" width="110" height="56" rx="8" fill="#f3f4f6"/>
      <text x="578" y="268" font-size="12" font-weight="600" fill="#111827">Green Tea Box</text>
      <text x="578" y="284" font-size="12" font-weight="700" fill="#000">$4.00</text>
    </g>

    <!-- Cart panel -->
    <rect x="744" y="112" width="416" height="636" rx="18" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="770" y="146" font-size="15" font-weight="700" fill="#111827">Cart (3 items)</text>

    <g font-size="12" fill="#374151">
      <text x="770" y="186" font-weight="600" fill="#111827">Basmati Rice 5kg</text>
      <text x="770" y="204" fill="#9ca3af">Qty 2 x $8.50</text>
      <text x="1130" y="195" font-weight="700" fill="#111827" text-anchor="end">$17.00</text>
      <line x1="770" y1="220" x2="1130" y2="220" stroke="#eef0f2"/>

      <text x="770" y="246" font-weight="600" fill="#111827">Sugar 2kg</text>
      <text x="770" y="264" fill="#9ca3af">Qty 1 x $3.10</text>
      <text x="1130" y="255" font-weight="700" fill="#111827" text-anchor="end">$3.10</text>
      <line x1="770" y1="280" x2="1130" y2="280" stroke="#eef0f2"/>

      <text x="770" y="306" font-weight="600" fill="#111827">Green Tea Box</text>
      <text x="770" y="324" fill="#9ca3af">Qty 1 x $4.00</text>
      <text x="1130" y="315" font-weight="700" fill="#111827" text-anchor="end">$4.00</text>
    </g>

    <line x1="770" y1="356" x2="1130" y2="356" stroke="#e5e7eb"/>
    <text x="770" y="384" font-size="12" fill="#6b7280">Subtotal</text>
    <text x="1130" y="384" font-size="12" font-weight="600" fill="#111827" text-anchor="end">$24.10</text>
    <text x="770" y="406" font-size="12" fill="#6b7280">Discount</text>
    <text x="1130" y="406" font-size="12" font-weight="600" fill="#111827" text-anchor="end">-$2.00</text>
    <text x="770" y="428" font-size="12" fill="#6b7280">Tax (5%)</text>
    <text x="1130" y="428" font-size="12" font-weight="600" fill="#111827" text-anchor="end">$1.11</text>
    <line x1="770" y1="446" x2="1130" y2="446" stroke="#e5e7eb"/>
    <text x="770" y="476" font-size="16" font-weight="700" fill="#000">Total</text>
    <text x="1130" y="476" font-size="20" font-weight="700" fill="#000" text-anchor="end">$23.21</text>

    <text x="770" y="516" font-size="12" font-weight="600" fill="#6b7280">Payment method</text>
    <rect x="770" y="528" width="110" height="38" rx="10" fill="#000"/>
    <text x="825" y="552" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Cash</text>
    <rect x="890" y="528" width="110" height="38" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="945" y="552" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Card</text>
    <rect x="1010" y="528" width="120" height="38" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="1070" y="552" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Mobile</text>

    <rect x="770" y="700" width="360" height="48" rx="12" fill="#000"/>
    <text x="950" y="729" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Charge $23.21</text>
  </g>
</svg>
