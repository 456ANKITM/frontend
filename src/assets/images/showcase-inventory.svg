<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" fill="none" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Inventory management screen preview</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <clipPath id="win"><rect x="40" y="40" width="1120" height="760" rx="24"/></clipPath>
  </defs>
  <rect x="40" y="40" width="1120" height="760" rx="24" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="40" y="40" width="1120" height="48" fill="#fff"/>
    <line x1="40" y1="88" x2="1160" y2="88" stroke="#eef0f2"/>
    <circle cx="68" cy="64" r="6" fill="#e5e7eb"/><circle cx="90" cy="64" r="6" fill="#e5e7eb"/><circle cx="112" cy="64" r="6" fill="#e5e7eb"/>
    <text x="600" y="68" font-size="13" font-weight="700" fill="#000" text-anchor="middle">Inventory</text>

    <text x="70" y="128" font-size="22" font-weight="700" fill="#000">Products</text>
    <rect x="950" y="104" width="150" height="38" rx="10" fill="#000"/>
    <text x="1025" y="128" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">+ Add product</text>

    <rect x="70" y="150" width="280" height="38" rx="10" fill="#f3f4f6"/>
    <text x="88" y="174" font-size="12" fill="#9ca3af">Search by name or SKU...</text>
    <rect x="362" y="150" width="130" height="38" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="427" y="174" font-size="12" fill="#374151" text-anchor="middle">All categories</text>
    <rect x="504" y="150" width="140" height="38" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="574" y="174" font-size="12" fill="#374151" text-anchor="middle">Low stock only</text>

    <!-- Table -->
    <rect x="70" y="206" width="1060" height="560" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <g font-size="11" font-weight="700" fill="#9ca3af">
      <text x="94" y="238">PRODUCT</text>
      <text x="470" y="238">SKU</text>
      <text x="620" y="238">CATEGORY</text>
      <text x="800" y="238">STOCK</text>
      <text x="960" y="238">PRICE</text>
      <text x="1060" y="238">STATUS</text>
    </g>
    <line x1="94" y1="252" x2="1106" y2="252" stroke="#eef0f2"/>

    <g font-size="13" fill="#374151">
      <rect x="94" y="268" width="36" height="36" rx="8" fill="#f3f4f6"/>
      <text x="142" y="291" font-weight="600" fill="#111827">Basmati Rice 5kg</text>
      <text x="470" y="291">SKU-1042</text>
      <text x="620" y="291">Grocery</text>
      <text x="800" y="291" font-weight="600">86</text>
      <text x="960" y="291">$8.50</text>
      <rect x="1055" y="276" width="56" height="22" rx="11" fill="#f3f4f6"/>
      <text x="1083" y="291" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">OK</text>

      <line x1="94" y1="316" x2="1106" y2="316" stroke="#f5f6f7"/>
      <rect x="94" y="332" width="36" height="36" rx="8" fill="#f3f4f6"/>
      <text x="142" y="355" font-weight="600" fill="#111827">Olive Oil 1L</text>
      <text x="470" y="355">SKU-1043</text>
      <text x="620" y="355">Grocery</text>
      <text x="800" y="355" font-weight="700" fill="#000">4</text>
      <text x="960" y="355">$6.20</text>
      <rect x="1040" y="340" width="76" height="22" rx="11" fill="#000"/>
      <text x="1078" y="355" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Low stock</text>

      <line x1="94" y1="380" x2="1106" y2="380" stroke="#f5f6f7"/>
      <rect x="94" y="396" width="36" height="36" rx="8" fill="#f3f4f6"/>
      <text x="142" y="419" font-weight="600" fill="#111827">Sugar 2kg</text>
      <text x="470" y="419">SKU-1044</text>
      <text x="620" y="419">Grocery</text>
      <text x="800" y="419" font-weight="600">151</text>
      <text x="960" y="419">$3.10</text>
      <rect x="1055" y="404" width="56" height="22" rx="11" fill="#f3f4f6"/>
      <text x="1083" y="419" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">OK</text>

      <line x1="94" y1="444" x2="1106" y2="444" stroke="#f5f6f7"/>
      <rect x="94" y="460" width="36" height="36" rx="8" fill="#f3f4f6"/>
      <text x="142" y="483" font-weight="600" fill="#111827">Green Tea Box</text>
      <text x="470" y="483">SKU-1045</text>
      <text x="620" y="483">Beverages</text>
      <text x="800" y="483" font-weight="600">102</text>
      <text x="960" y="483">$4.00</text>
      <rect x="1055" y="468" width="56" height="22" rx="11" fill="#f3f4f6"/>
      <text x="1083" y="483" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">OK</text>

      <line x1="94" y1="508" x2="1106" y2="508" stroke="#f5f6f7"/>
      <rect x="94" y="524" width="36" height="36" rx="8" fill="#f3f4f6"/>
      <text x="142" y="547" font-weight="600" fill="#111827">Cooking Salt 1kg</text>
      <text x="470" y="547">SKU-1046</text>
      <text x="620" y="547">Grocery</text>
      <text x="800" y="547" font-weight="700" fill="#000">2</text>
      <text x="960" y="547">$1.20</text>
      <rect x="1040" y="532" width="76" height="22" rx="11" fill="#000"/>
      <text x="1078" y="547" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Low stock</text>
    </g>
  </g>
</svg>
