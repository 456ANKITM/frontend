<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" fill="none" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Reports and analytics screen preview</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="area2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="40" y="40" width="1120" height="760" rx="24"/></clipPath>
  </defs>
  <rect x="40" y="40" width="1120" height="760" rx="24" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="40" y="40" width="1120" height="48" fill="#fff"/>
    <line x1="40" y1="88" x2="1160" y2="88" stroke="#eef0f2"/>
    <circle cx="68" cy="64" r="6" fill="#e5e7eb"/><circle cx="90" cy="64" r="6" fill="#e5e7eb"/><circle cx="112" cy="64" r="6" fill="#e5e7eb"/>
    <text x="600" y="68" font-size="13" font-weight="700" fill="#000" text-anchor="middle">Reports</text>

    <text x="70" y="128" font-size="22" font-weight="700" fill="#000">Store comparison</text>
    <rect x="900" y="104" width="200" height="38" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="930" y="128" font-size="12" fill="#374151">Export: PDF / Excel</text>

    <!-- Bar chart: store comparison -->
    <rect x="70" y="160" width="1060" height="260" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="92" y="190" font-size="14" font-weight="700" fill="#111827">Revenue by store — this month</text>
    <line x1="92" y1="380" x2="1108" y2="380" stroke="#eef0f2"/>
    <line x1="92" y1="330" x2="1108" y2="330" stroke="#f5f6f7"/>
    <line x1="92" y1="280" x2="1108" y2="280" stroke="#f5f6f7"/>
    <line x1="92" y1="230" x2="1108" y2="230" stroke="#f5f6f7"/>

    <rect x="160" y="250" width="90" height="130" rx="8" fill="#000"/>
    <text x="205" y="400" font-size="12" fill="#374151" text-anchor="middle">Main Street</text>
    <text x="205" y="238" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">$18.4k</text>

    <rect x="370" y="290" width="90" height="90" rx="8" fill="#374151"/>
    <text x="415" y="400" font-size="12" fill="#374151" text-anchor="middle">Airport Rd</text>
    <text x="415" y="278" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">$11.2k</text>

    <rect x="580" y="310" width="90" height="70" rx="8" fill="#9ca3af"/>
    <text x="625" y="400" font-size="12" fill="#374151" text-anchor="middle">Riverside</text>
    <text x="625" y="298" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">$8.6k</text>

    <rect x="790" y="270" width="90" height="110" rx="8" fill="#6b7280"/>
    <text x="835" y="400" font-size="12" fill="#374151" text-anchor="middle">Uptown</text>
    <text x="835" y="258" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">$14.1k</text>

    <!-- Profit & Loss summary -->
    <rect x="70" y="436" width="520" height="330" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="92" y="468" font-size="14" font-weight="700" fill="#111827">Profit &amp; Loss — consolidated</text>
    <g font-size="13" fill="#374151">
      <text x="92" y="508">Revenue</text><text x="568" y="508" text-anchor="end" font-weight="600" fill="#111827">$52,300</text>
      <line x1="92" y1="522" x2="568" y2="522" stroke="#f5f6f7"/>
      <text x="92" y="548">Cost of goods</text><text x="568" y="548" text-anchor="end" font-weight="600" fill="#111827">$31,900</text>
      <line x1="92" y1="562" x2="568" y2="562" stroke="#f5f6f7"/>
      <text x="92" y="588">Operating expenses</text><text x="568" y="588" text-anchor="end" font-weight="600" fill="#111827">$6,400</text>
    </g>
    <line x1="92" y1="612" x2="568" y2="612" stroke="#e5e7eb"/>
    <text x="92" y="646" font-size="16" font-weight="700" fill="#000">Net profit</text>
    <text x="568" y="646" font-size="20" font-weight="700" fill="#000" text-anchor="end">$14,000</text>
    <rect x="92" y="672" width="476" height="56" rx="12" fill="#f3f4f6"/>
    <path d="M110 700 l50 -26 l40 18 l60 -34" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="705" font-size="12" fill="#374151" text-anchor="middle">Margin trending up vs last month</text>

    <!-- Top products -->
    <rect x="610" y="436" width="520" height="330" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="632" y="468" font-size="14" font-weight="700" fill="#111827">Top products by revenue</text>
    <g font-size="13" fill="#374151">
      <text x="632" y="508" font-weight="600" fill="#111827">1. Basmati Rice 5kg</text>
      <text x="1108" y="508" text-anchor="end" font-weight="700" fill="#111827">$2,108</text>
      <line x1="632" y1="522" x2="1108" y2="522" stroke="#f5f6f7"/>

      <text x="632" y="548" font-weight="600" fill="#111827">2. Olive Oil 1L</text>
      <text x="1108" y="548" text-anchor="end" font-weight="700" fill="#111827">$1,215</text>
      <line x1="632" y1="562" x2="1108" y2="562" stroke="#f5f6f7"/>

      <text x="632" y="588" font-weight="600" fill="#111827">3. Sugar 2kg</text>
      <text x="1108" y="588" text-anchor="end" font-weight="700" fill="#111827">$468</text>
      <line x1="632" y1="602" x2="1108" y2="602" stroke="#f5f6f7"/>

      <text x="632" y="628" font-weight="600" fill="#111827">4. Green Tea Box</text>
      <text x="1108" y="628" text-anchor="end" font-weight="700" fill="#111827">$408</text>
    </g>
    <rect x="632" y="660" width="476" height="68" rx="12" fill="#000"/>
    <text x="660" y="690" font-size="12" font-weight="600" fill="#fff">Inventory valuation</text>
    <text x="660" y="712" font-size="18" font-weight="700" fill="#fff">$61,480 at cost</text>
  </g>
</svg>
